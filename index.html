<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LG R&amp;D US Partner Meetings</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a booking ledger. Each day is split into two track columns (SW QA | App Dev); hours run down. Phone stacks days. */
:root{
  color-scheme:light;
  --ink:#16202e; --muted:#5d6878; --ground:#f3f5f8; --sheet:#ffffff; --rule:#dce1e8; --rule-strong:#b9c2cf;
  --accent:#2b5fd9; --danger:#c0392b;
  --qa:#3b4fa8; --dev:#7a3fa0;
  --open:#1f8a5b; --open-bg:#e5f4ec;
  --hold:#a96a00; --hold-bg:#fbf0d9;
  --busy:#8a94a3; --busy-bg:#eceff3;
  --booked:#4a5463; --booked-bg:#d9dee5;
  --admin-ground:#fbeee6; --admin-bar:#b4541f; --admin-bar-ink:#ffffff;
  --f-display:"Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --ink:#e7ebf1; --muted:#9aa5b5; --ground:#10151d; --sheet:#171e28; --rule:#2a3442; --rule-strong:#475366;
    --accent:#7aa2ff; --danger:#ff8a7a;
    --qa:#9aabff; --dev:#d29cf2;
    --open:#5fd39b; --open-bg:#173527;
    --hold:#f0b54a; --hold-bg:#3a2c10;
    --busy:#6f7a8a; --busy-bg:#1f2732;
    --booked:#c3cbd8; --booked-bg:#2c3644;
    --admin-ground:#24170f; --admin-bar:#e08a4f; --admin-bar-ink:#1a0f08;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-display);font-size:15px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));}
body.admin{background:var(--admin-ground)}
.adminbar{display:none;position:sticky;top:0;z-index:5;margin-left:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));margin-right:calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding:8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));background:var(--admin-bar);color:var(--admin-bar-ink);
  font-size:13px;align-items:center;gap:8px 14px;flex-wrap:wrap}
body.admin .adminbar{display:flex}
.ab-label{font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.ab-msg{flex:1 1 200px;min-width:0;opacity:.95}
.ab-msg.err{font-weight:700}
.ab-btns{display:flex;gap:6px;flex-wrap:wrap}
.abtn{all:unset;cursor:pointer;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:5px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--admin-bar-ink) 55%,transparent)}
.abtn.primary{background:var(--admin-bar-ink);color:var(--admin-bar)}
.abtn[disabled]{opacity:.4;cursor:default}
.abtn:focus-visible{outline:2px solid var(--admin-bar-ink);outline-offset:2px}
.admincorner{position:absolute;top:10px;right:0;z-index:6;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.admincorner .adminlink{opacity:.5}
.popover{width:min(280px, calc(100vw - 32px));background:var(--sheet);border:1px solid var(--rule-strong);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 8px 28px rgba(10,15,25,.18)}
.popover input{font-family:var(--f-mono);font-size:13px;width:100%}
.popover .msg{font-size:12px}
.wrap{position:relative;max-width:1280px;margin:0 auto;padding-block:40px 64px;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
h1{font-size:clamp(28px,4.4vw,40px);line-height:1.1;font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:10px 0 0;max-width:62ch}
.totals{display:flex;gap:28px;font-variant-numeric:tabular-nums}
.total{display:flex;flex-direction:column;gap:2px}
.total b{font-size:34px;font-weight:700;line-height:1;color:var(--open)}
.total span{color:var(--muted);font-size:13px}
.tk{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.total .tk.qa,.trackhead .tk.qa{color:var(--qa)}
.total .tk.dev,.trackhead .tk.dev{color:var(--dev)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.lg-open{background:var(--open-bg);box-shadow:inset 0 0 0 1.5px var(--open)}
.lg-booked{background:var(--booked-bg);box-shadow:inset 0 0 0 1.5px var(--booked)}
.lg-hold{background:var(--hold-bg);box-shadow:inset 0 0 0 1.5px var(--hold)}
.lg-busy{background:var(--busy-bg);box-shadow:inset 0 0 0 1.5px var(--busy)}
.status{margin-left:auto;font-size:12.5px}
.status.err{color:var(--danger)}

.board-scroll{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--sheet)}
.board{display:grid;grid-template-columns:64px repeat(10,minmax(100px,1fr));min-width:1080px}
.admin .board{grid-template-columns:64px repeat(10,minmax(128px,1fr));min-width:1360px}
.board > div{border-top:1px solid var(--rule)}
.board > .first{border-left:2px solid var(--rule-strong)}
.board > .second{border-left:1px dashed var(--rule)}
.board > .r1{border-top:0}
.corner{grid-row:span 2}
.dayhead{grid-column:span 2;padding:14px 12px 10px;display:flex;align-items:baseline;gap:8px}
.dow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.date{font-size:18px;font-weight:600}
.trackhead{padding:8px 10px;display:flex;flex-direction:column}
.trackhead .cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tcol{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);padding:12px 8px 0 12px;font-variant-numeric:tabular-nums}
.cell{padding:5px;display:flex}

.slot{all:unset;box-sizing:border-box;width:100%;min-height:44px;border-radius:6px;padding:6px 9px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;font-family:var(--f-display);transition:box-shadow .12s ease;overflow-wrap:anywhere}
.slot .t{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.slot .s{font-size:12px;font-weight:600;letter-spacing:.02em}
.slot .co{font-size:12.5px;font-weight:700;color:var(--ink);margin-top:3px;line-height:1.25}
.slot .pp{font-size:11.5px;color:var(--muted);line-height:1.3}
.slot.open{background:var(--open-bg);color:var(--open);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--open) 45%,transparent)}
.slot.booked{background:var(--booked-bg);color:var(--booked);cursor:default}
.slot.booked .s::before{content:"● ";font-size:9px;vertical-align:1px}
.slot.hold{background:var(--hold-bg);color:var(--hold);cursor:default;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--hold) 45%,transparent)}
.slot.busy{background:var(--busy-bg);color:var(--busy);cursor:default}
.slot.busy .t{text-decoration:line-through}
.slot.open:hover{box-shadow:inset 0 0 0 2px var(--open)}
.slot.picked{box-shadow:inset 0 0 0 2.5px var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--sheet));color:var(--accent)}
.admin .slot{cursor:pointer}
.admin .slot:hover{box-shadow:inset 0 0 0 2px var(--accent)}
.slot.changed{box-shadow:inset 0 0 0 2px var(--accent)}
.slot:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:18px 20px}
.panel p{margin:0;max-width:72ch}
.panel .pick{font-family:var(--f-mono);font-size:14px;color:var(--accent);font-weight:500}
.foot{font-size:13px;color:var(--muted);margin:0}
.footrow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.adminlink{all:unset;cursor:pointer;font-size:12px;color:var(--muted);opacity:.55;padding:4px 6px;border-radius:5px}
.adminlink:hover{opacity:1;text-decoration:underline}
.adminlink:focus-visible{opacity:1;outline:2px solid var(--accent);outline-offset:2px}

.adminbox{border-color:color-mix(in srgb,var(--accent) 50%,var(--rule));display:flex;flex-direction:column;gap:12px}
.adminbox h2{font-size:16px;margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select,textarea{font:inherit;font-size:14px;padding:8px 10px;border-radius:7px;border:1px solid var(--rule-strong);background:var(--ground);color:var(--ink);min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.adminbox input{font-family:var(--f-mono);font-size:13px;flex:1 1 220px;max-width:360px}
.btn{all:unset;cursor:pointer;font-weight:600;font-size:14px;padding:8px 16px;border-radius:7px;background:var(--accent);color:var(--sheet)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule-strong)}
.btn[disabled]{opacity:.45;cursor:default}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{font-size:13px;color:var(--muted);margin:0}
.msg.err{color:var(--danger)}

dialog{border:1px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:0;width:min(460px, calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,15,25,.45)}
dialog form{display:flex;flex-direction:column;gap:14px;padding:22px}
dialog h3{margin:0;font-size:17px}
dialog .when{font-family:var(--f-mono);font-size:13px;color:var(--muted);margin:-8px 0 0}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em}
.field.missing label{color:var(--danger)}
.field.missing input{border-color:var(--danger);box-shadow:0 0 0 1px var(--danger);background:color-mix(in srgb,var(--danger) 8%,var(--ground))}
.dlg-msg{margin:0;font-size:13px;color:var(--danger)}
.admin .slot.incomplete{box-shadow:inset 0 0 0 2px var(--danger)}
.slot .miss{font-size:11px;font-weight:600;color:var(--danger);margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
textarea{resize:vertical;min-height:60px}
.dlg-btns{display:flex;justify-content:flex-end;gap:8px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}

.cards{display:none;flex-direction:column;gap:14px}
.daycard{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.daycard .dayhead{border-bottom:1px solid var(--rule)}
.daycard .cols{display:grid;grid-template-columns:1fr 1fr}
.daycard .col{display:flex;flex-direction:column;gap:6px;padding:8px;min-width:0}
.daycard .col + .col{border-left:1px dashed var(--rule)}
.daycard .trackhead{padding:2px 2px 4px}
@media (max-width:640px){
  .board-scroll{display:none}
  .cards{display:flex}
}
@media (prefers-reduced-motion: reduce){.slot{transition:none}}
</style>
</head>
<body>
<div class="adminbar" role="region" aria-label="Admin controls">
  <span class="ab-label">Admin mode</span>
  <span class="ab-msg" id="adminMsg" role="status">Click a slot to edit. Apply saves to GitHub.</span>
  <span class="ab-btns">
    <button class="abtn" id="discardBtn" type="button" disabled>Discard</button>
    <button class="abtn primary" id="saveBtn" type="button" disabled>Save</button>
    <button class="abtn" id="pptBtn" type="button" title="Download the booked schedule as a PowerPoint slide">Export PPT</button>
    <button class="abtn" id="logoutBtn" type="button" title="Exit and forget the token on this browser">Lock</button>
    <button class="abtn" id="exitBtn" type="button" title="Back to the partner view">Exit</button>
  </span>
</div>
<div class="wrap">
  <div class="admincorner">
    <button class="adminlink" id="adminToggle" type="button" aria-expanded="false" aria-controls="adminBox">Admin</button>
    <div class="popover" id="adminBox" hidden>
      <input id="tokenInput" type="password" autocomplete="off" placeholder="GitHub token" aria-label="GitHub token">
      <input id="passInput" type="password" autocomplete="off" placeholder="Admin passphrase" aria-label="Admin passphrase">
      <button class="btn" id="loginBtn" type="button">Unlock</button>
      <p class="msg" id="loginMsg"></p>
    </div>
  </div>
  <header>
    <div>
      <p class="eyebrow">Mon Nov 30 – Fri Dec 4, 2026 · <span id="tz">PST (UTC−8)</span></p>
      <h1>LG R&amp;D US Partner Meetings</h1>
    </div>
    <div class="totals" id="totals"></div>
  </header>

  <div class="legend">
    <span><i class="lg-open"></i>Open</span>
    <span><i class="lg-booked"></i>Booked</span>
    <span><i class="lg-hold"></i>Tentatively held</span>
    <span><i class="lg-busy"></i>Unavailable</span>
    <span class="status" id="loadStatus">Loading latest bookings…</span>
  </div>
  <div class="board-scroll"><div class="board" id="board"></div></div>
  <div class="cards" id="cards"></div>
  <div class="panel"><p id="pickText">No slot selected yet. Pick an open block above.</p></div>
  <p class="foot" id="updated"></p>
</div>

<dialog id="dlg">
  <form id="dlgForm" method="dialog">
    <h3 id="dlgTitle">Edit slot</h3>
    <p class="when" id="dlgWhen"></p>
    <div class="field">
      <label for="fStatus">Status</label>
      <select id="fStatus">
        <option value="open">Open</option>
        <option value="booked">Booked</option>
        <option value="hold">Tentatively held</option>
        <option value="busy">Unavailable</option>
      </select>
    </div>
    <div class="field"><label for="fCo">Company</label><input id="fCo" type="text" autocomplete="off" list="coList" placeholder="Type or pick a saved partner"><datalist id="coList"></datalist></div>
    <div class="field"><label for="fName">Contact person</label><input id="fName" type="text" autocomplete="off"></div>
    <div class="grid2">
      <div class="field"><label for="fEmail">Email</label><input id="fEmail" type="email" autocomplete="off"></div>
      <div class="field"><label for="fPhone">Phone</label><input id="fPhone" type="tel" autocomplete="off"></div>
    </div>
    <div class="field"><label for="fAddr">Location / address</label><input id="fAddr" type="text" autocomplete="off" placeholder="Street, city, or meeting room / video link"></div>
    <div class="field"><label for="fNote">Note</label><textarea id="fNote"></textarea></div>
    <p class="dlg-msg" id="dlgMsg" hidden></p>
    <div class="dlg-btns">
      <button class="btn ghost" type="button" id="dlgCancel">Cancel</button>
      <button class="btn" type="submit" id="dlgApply">Apply</button>
    </div>
  </form>
</dialog>

<!--
  Layout config. Bookings live in slots.json (edited from the #admin view).
  slots.json: "slots" maps "<track>|YYYY-MM-DDTHH" to "booked" | "hold" | "busy" (open slots are absent).
  "details" holds partner company/contact info, AES-GCM encrypted with the admin passphrase.
-->
<script id="config" type="application/json">
{
  "repo": "chococula/USpartnersTimeTable",
  "branch": "main",
  "file": "slots.json",
  "tz": "PST (UTC−8)",
  "tracks": [
    {"id": "qa", "name": "SW QA"},
    {"id": "dev", "name": "App Dev"}
  ],
  "days": ["2026-11-30", "2026-12-01", "2026-12-02", "2026-12-03", "2026-12-04"],
  "startHour": 9,
  "endHour": 17
}
</script>
<script>
(function(){
  var C = JSON.parse(document.getElementById('config').textContent);
  var slots = {}, details = {}, remote = null, sha = null, savedSnap = '';
  var picked = null, admin = false, token = null, pass = null, saving = false, editing = null;
  var API = 'https://api.github.com/repos/'+C.repo+'/contents/'+C.file;
  var DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var LABEL = {open:'Open', booked:'Booked', hold:'Held', busy:'Unavailable'};
  var TRACK = {}; C.tracks.forEach(function(t){TRACK[t.id]=t.name});
  var $ = function(id){return document.getElementById(id)};
  function pad(n){return (n<10?'0':'')+n}
  function parts(iso){var p=iso.split('-').map(Number);var d=new Date(Date.UTC(p[0],p[1]-1,p[2]));return {dow:DOW[d.getUTCDay()],mon:MON[p[1]-1],day:p[2]}}
  function key(t,d,h){return t+'|'+d+'T'+pad(h)}
  function state(k){return slots[k]||'open'}
  var hours=[];for(var h=C.startHour;h<C.endHour;h++)hours.push(h);
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function openCount(t,d){return hours.filter(function(h){return state(key(t,d,h))==='open'}).length}
  // Fields a Booked slot should have; empty ones are flagged red in the editor and the table.
  var REQ = ['company','name','email','phone','address'];
  var REQ_LABEL = {company:'Company', name:'Contact', email:'Email', phone:'Phone', address:'Location'};
  var REQ_INPUT = {company:'fCo', name:'fName', email:'fEmail', phone:'fPhone', address:'fAddr'};
  function missingOf(info){ return REQ.filter(function(f){ return !(info[f]||'').trim(); }); }
  function sorted(o){var r={};Object.keys(o).sort().forEach(function(k){r[k]=o[k]});return r}
  function snap(){return JSON.stringify({s:sorted(slots),d:sorted(details)})}
  function savedOf(k){try{var o=JSON.parse(savedSnap);return JSON.stringify([o.s[k]||'open',o.d[k]||null])}catch(e){return ''}}
  function store(k,v){try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v);}catch(e){return null}}
  function whenText(k){var t=k.split('|')[0], r=k.split('|')[1], d=r.slice(0,10), hh=Number(r.slice(11)), p=parts(d);
    return {track:TRACK[t], text:p.dow+' '+p.mon+' '+p.day+', '+pad(hh)+':00–'+pad(hh+1)+':00 '+C.tz};}

  // ---- crypto (AES-GCM, key from passphrase via PBKDF2) ----
  function toB64(u8){var s='';for(var i=0;i<u8.length;i++)s+=String.fromCharCode(u8[i]);return btoa(s)}
  function fromB64(b){var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
  async function deriveKey(passphrase,salt){
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(passphrase),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:200000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  }
  async function decryptDetails(blob,passphrase){
    if(!blob) return {};
    var k=await deriveKey(passphrase,fromB64(blob.salt));
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(blob.iv)},k,fromB64(blob.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  async function encryptDetails(obj,passphrase,prevBlob){
    var salt=prevBlob?fromB64(prevBlob.salt):crypto.getRandomValues(new Uint8Array(16));
    var iv=crypto.getRandomValues(new Uint8Array(12));
    var k=await deriveKey(passphrase,salt);
    var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,new TextEncoder().encode(JSON.stringify(obj)));
    return {v:1,salt:toB64(salt),iv:toB64(iv),ct:toB64(new Uint8Array(ct))};
  }

  // ---- render ----
  function slotBtn(t,d,h,suffix){
    var k=key(t,d,h), st=state(k), info=admin?details[k]:null;
    var changed=admin && savedOf(k)!==JSON.stringify([st,details[k]||null]);
    var miss=(admin && st==='booked')? missingOf(details[k]||{}) : [];
    var b=el('button','slot '+st+(picked===k?' picked':'')+(changed?' changed':'')+(miss.length&&!changed?' incomplete':''));
    b.type='button'; b.id='slot-'+k.replace('|','-')+suffix;
    b.appendChild(el('span','t',pad(h)+':00 – '+pad(h+1)+':00'));
    b.appendChild(el('span','s',picked===k?'Selected':LABEL[st]));
    if(info){
      if(info.company) b.appendChild(el('span','co',info.company));
      var who=[info.name,info.email,info.phone,info.address?'📍 '+info.address:''].filter(Boolean);
      who.forEach(function(x){b.appendChild(el('span','pp',x))});
      if(info.note) b.appendChild(el('span','pp',info.note));
    }
    if(miss.length) b.appendChild(el('span','miss','Missing: '+miss.map(function(f){return REQ_LABEL[f]}).join(', ')));
    var p=parts(d);
    b.setAttribute('aria-label',TRACK[t]+', '+p.dow+' '+p.mon+' '+p.day+', '+pad(h)+':00 to '+pad(h+1)+':00, '+LABEL[st]+(info&&info.company?', '+info.company:''));
    if(!admin && st!=='open'){b.disabled=true;return b;}
    b.addEventListener('click',function(){
      if(admin){ openEditor(k); return; }
      picked=(picked===k?null:k); render();
      var again=$(b.id); if(again) again.focus();
    });
    return b;
  }
  function dayHead(d,extra){
    var p=parts(d), e=el('div','dayhead'+(extra||''));
    e.appendChild(el('span','dow',p.dow)); e.appendChild(el('span','date',p.mon+' '+p.day));
    return e;
  }
  function trackHead(t,d,extra){
    var e=el('div','trackhead'+(extra||''));
    e.appendChild(el('span','tk '+t,TRACK[t]));
    e.appendChild(el('span','cnt',openCount(t,d)+' of '+hours.length+' open'));
    return e;
  }
  function render(){
    document.body.classList.toggle('admin',admin);
    var board=$('board'); board.textContent='';
    board.appendChild(el('div','corner r1'));
    C.days.forEach(function(d){board.appendChild(dayHead(d,' r1 first'))});
    C.days.forEach(function(d){ C.tracks.forEach(function(t,i){board.appendChild(trackHead(t.id,d,i===0?' first':' second'))}); });
    hours.forEach(function(h){
      board.appendChild(el('div','tcol',pad(h)+':00'));
      C.days.forEach(function(d){
        C.tracks.forEach(function(t,i){
          var c=el('div','cell'+(i===0?' first':' second'));c.appendChild(slotBtn(t.id,d,h,''));board.appendChild(c);
        });
      });
    });
    var cards=$('cards'); cards.textContent='';
    C.days.forEach(function(d){
      var card=el('div','daycard'); card.appendChild(dayHead(d));
      var cols=el('div','cols');
      C.tracks.forEach(function(t){
        var col=el('div','col'); col.appendChild(trackHead(t.id,d));
        hours.forEach(function(h){col.appendChild(slotBtn(t.id,d,h,'-m'))});
        cols.appendChild(col);
      });
      card.appendChild(cols); cards.appendChild(card);
    });
    var totals=$('totals'); totals.textContent='';
    C.tracks.forEach(function(t){
      var n=0; C.days.forEach(function(d){n+=openCount(t.id,d)});
      var box=el('div','total');
      box.appendChild(el('span','tk '+t.id,t.name));
      box.appendChild(el('b',null,String(n)));
      box.appendChild(el('span',null,'of '+(C.days.length*hours.length)+' open'));
      totals.appendChild(box);
    });
    $('tz').textContent=C.tz;
    if(picked && state(picked)!=='open') picked=null;
    var pt=$('pickText');
    if(picked){ var w=whenText(picked); pt.textContent='Your pick: '; pt.appendChild(el('span','pick',w.track+' · '+w.text)); }
    else pt.textContent=admin?'Admin view. Partners see Booked slots without any company or contact details.':'No slot selected yet. Pick an open block above.';
    var u=remote&&remote.updated;
    $('updated').textContent=(u?'Last updated '+new Date(u).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:'America/Los_Angeles'})+' PT. ':'')+'Times shown in '+C.tz+'.';
    var dirty=snap()!==savedSnap;
    $('saveBtn').disabled=!dirty||saving; $('discardBtn').disabled=!dirty||saving;
    if(savedSnap) backupDraft();
  }

  // ---- load ----
  function b64text(s){return decodeURIComponent(escape(atob(s.replace(/\n/g,''))))}
  function textb64(s){return btoa(unescape(encodeURIComponent(s)))}
  function headers(){var h={'Accept':'application/vnd.github+json'}; if(token) h.Authorization='Bearer '+token; return h}
  async function fetchRemote(){
    try{
      var r=await fetch(API+'?ref='+C.branch+'&t='+Date.now(),{headers:headers(),cache:'no-store'});
      if(r.status===404){ sha=null; return {slots:{},details:null,updated:null}; }
      if(!r.ok) throw new Error('api '+r.status);
      var j=await r.json(); sha=j.sha; return JSON.parse(b64text(j.content));
    }catch(e){
      var r2=await fetch(C.file+'?t='+Date.now(),{cache:'no-store'});
      if(!r2.ok) throw new Error('pages '+r2.status);
      return r2.json();
    }
  }
  async function load(){
    var status=$('loadStatus');
    try{
      remote=await fetchRemote();
      slots=remote.slots||{};
      details=(admin&&pass)? await decryptDetails(remote.details,pass) : {};
      savedSnap=snap();
      if(admin && restoreDraft()) msg('Restored edits from this browser that were not saved yet. Press Save bookings to store them.',true);
      status.textContent=''; status.className='status';
    }catch(e){
      status.textContent='Could not load the latest bookings. Refresh the page to try again.'; status.className='status err';
    }
    render();
  }

  // ---- admin ----
  function msg(t,err){
    var m=$(admin?'adminMsg':'loginMsg');
    m.textContent=t||(admin?'Click a slot to edit. Apply saves to GitHub.':'');
    m.className=(admin?'ab-msg':'msg')+(err?' err':'');
  }
  async function unlock(t,p){
    msg('Checking…');
    try{
      var r=await fetch('https://api.github.com/repos/'+C.repo,{headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+t}});
      if(!r.ok) throw new Error('token');
      var j=await r.json();
      if(!(j.permissions&&j.permissions.push)) throw new Error('nopush');
      token=t;
      var data=await fetchRemote();
      try{ await decryptDetails(data.details,p); }catch(e){ throw new Error('pass'); }
      pass=p; admin=true; picked=null;
      store('avail-admin-token',t); store('avail-admin-pass',p);
      closePopover(); $('adminToggle').hidden=true;
      msg(data.details?'Click a slot to edit. Apply saves to GitHub.':'Unlocked. This passphrase will encrypt partner details from now on. Keep it safe: without it the details cannot be recovered.');
      await load();
    }catch(e){
      token=null; store('avail-admin-token',null); store('avail-admin-pass',null);
      var m={token:'That GitHub token was not accepted. Check it and try again.',
             nopush:'This token can read the repository but cannot write to it. Give it Contents: Read and write.',
             pass:'The passphrase does not match the one used for the saved details.'}[e.message]||'Unlock failed. Check your connection and try again.';
      msg(m,true);
      $('adminBox').hidden=false; $('adminToggle').setAttribute('aria-expanded','true');
    }
  }
  $('loginBtn').addEventListener('click',function(){
    var t=$('tokenInput').value.trim(), p=$('passInput').value;
    if(!t||!p){ msg('Enter both the GitHub token and the admin passphrase.',true); return; }
    unlock(t,p);
  });
  ['tokenInput','passInput'].forEach(function(id){ $(id).addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); $('loginBtn').click(); } }); });
  $('logoutBtn').addEventListener('click',function(){
    token=null; pass=null; admin=false; details={};
    store('avail-admin-token',null); store('avail-admin-pass',null); store('avail-draft',null);
    $('tokenInput').value=''; $('passInput').value='';
    $('adminToggle').hidden=false; msg('');
    load();
  });
  $('discardBtn').addEventListener('click',function(){ var o=JSON.parse(savedSnap); slots=o.s; details=o.d; render(); msg('Changes discarded.'); });

  function openEditor(k){
    editing=k; var w=whenText(k), info=details[k]||{};
    $('dlgTitle').textContent=w.track; $('dlgWhen').textContent=w.text;
    $('fStatus').value=state(k)==='open'?'booked':state(k);
    $('fCo').value=info.company||''; $('fName').value=info.name||'';
    $('fEmail').value=info.email||''; $('fPhone').value=info.phone||''; $('fAddr').value=info.address||''; $('fNote').value=info.note||'';
    applyWarned=false; markMissing(false);
    var list=$('coList'); list.textContent='';
    Object.keys(partners()).sort(function(a,b){return a.localeCompare(b)}).forEach(function(c){ var o=document.createElement('option'); o.value=c; list.appendChild(o); });
    $('dlg').showModal(); $('fCo').focus();
  }
  // Known partners, built from every saved slot's details (last entry per company wins).
  function partners(){
    var m={};
    Object.keys(details).sort().forEach(function(k){ var d=details[k]; if(d&&d.company) m[d.company]=d; });
    return m;
  }
  $('fCo').addEventListener('input',function(){
    var p=partners()[$('fCo').value.trim()];
    if(!p) return;
    $('fName').value=p.name||''; $('fEmail').value=p.email||''; $('fPhone').value=p.phone||''; $('fAddr').value=p.address||'';
  });
  var applyWarned=false;
  function formInfo(){
    return {company:$('fCo').value.trim(),name:$('fName').value.trim(),email:$('fEmail').value.trim(),phone:$('fPhone').value.trim(),address:$('fAddr').value.trim(),note:$('fNote').value.trim()};
  }
  // show = true: paint every empty required field red (only for Booked). Returns the missing list.
  function markMissing(show){
    var miss = ($('fStatus').value==='booked') ? missingOf(formInfo()) : [];
    REQ.forEach(function(f){ $(REQ_INPUT[f]).closest('.field').classList.toggle('missing', show && miss.indexOf(f)>=0); });
    var m=$('dlgMsg');
    if(show && miss.length){ m.hidden=false; m.textContent='Missing: '+miss.map(function(f){return REQ_LABEL[f]}).join(', ')+'. Fill them in, or press Apply again to save without them.'; }
    else { m.hidden=true; m.textContent=''; }
    return miss;
  }
  ['fCo','fName','fEmail','fPhone','fAddr','fStatus'].forEach(function(id){
    $(id).addEventListener(id==='fStatus'?'change':'input',function(){ if(applyWarned) markMissing(true); });
  });
  $('dlgCancel').addEventListener('click',function(){ $('dlg').close(); });
  $('dlgForm').addEventListener('submit',function(e){
    e.preventDefault();
    var miss=markMissing(true);
    if(miss.length && !applyWarned){ applyWarned=true; $(REQ_INPUT[miss[0]]).focus(); return; }
    var k=editing, st=$('fStatus').value;
    var info=formInfo();
    Object.keys(info).forEach(function(x){ if(!info[x]) delete info[x]; });
    if(st==='open'){ delete slots[k]; delete details[k]; }
    else { slots[k]=st; if(Object.keys(info).length) details[k]=info; else delete details[k]; }
    $('dlg').close(); render();
    var b=$('slot-'+k.replace('|','-')); if(b) b.focus();
    save();  // every Apply is written to GitHub straight away
  });

  // Local changes = slots whose status or details differ from the last saved copy.
  function localChanges(){
    var o=JSON.parse(savedSnap), ch={};
    var keys={}; [slots,details,o.s,o.d].forEach(function(m){ Object.keys(m).forEach(function(k){ keys[k]=1; }); });
    Object.keys(keys).forEach(function(k){
      if(JSON.stringify([slots[k]||null,details[k]||null])!==JSON.stringify([o.s[k]||null,o.d[k]||null])) ch[k]={s:slots[k]||null,d:details[k]||null};
    });
    return ch;
  }
  function applyChanges(ch){
    Object.keys(ch).forEach(function(k){
      if(ch[k].s) slots[k]=ch[k].s; else delete slots[k];
      if(ch[k].d) details[k]=ch[k].d; else delete details[k];
    });
  }
  // Unsaved edits are mirrored to this browser so a failed save or a reload never loses them.
  function backupDraft(){
    if(!admin) return;
    var ch=localChanges();
    store('avail-draft', Object.keys(ch).length ? JSON.stringify(ch) : null);
  }
  function restoreDraft(){
    var raw=store('avail-draft'); if(!raw) return false;
    try{ var ch=JSON.parse(raw); if(!Object.keys(ch).length) return false; applyChanges(ch); return true; }catch(e){ return false; }
  }

  var saveAgain=false;
  async function save(retried){
    if(saving){ saveAgain=true; return; }
    if(snap()===savedSnap) return;
    saving=true; render(); msg('Saving…');
    try{
      var clean={}; Object.keys(details).forEach(function(k){ if(slots[k]) clean[k]=details[k]; }); details=clean;
      var blob=Object.keys(details).length? await encryptDetails(sorted(details),pass,remote&&remote.details) : null;
      var body={slots:sorted(slots),details:blob,updated:new Date().toISOString()};
      var payload={message:'Update bookings',content:textb64(JSON.stringify(body,null,2)+'\n'),branch:C.branch};
      if(sha) payload.sha=sha;
      var r=await fetch(API,{method:'PUT',headers:Object.assign(headers(),{'Content-Type':'application/json'}),body:JSON.stringify(payload)});
      var j=await r.json().catch(function(){return {}});
      saving=false;
      if(r.ok){
        sha=j.content.sha; remote=body; savedSnap=snap(); store('avail-draft',null); render();
        msg('Saved to GitHub. Partners see Booked when they open or refresh the page; the details stay encrypted.');
      } else if((r.status===409||r.status===422) && !retried){
        // someone saved in between: load theirs, re-apply only my edits on top, save once more
        var ch=localChanges(); await load(); applyChanges(ch); render(); saving=false; await save(true); return;
      } else { render(); msg('Save failed (GitHub error '+r.status+'). Your changes are kept in this browser; press Save bookings to retry.',true); }
    }catch(e){ saving=false; render(); msg('Save failed: no connection to GitHub. Your changes are kept in this browser; press Save bookings to retry.',true); }
    if(saveAgain){ saveAgain=false; save(); }
  }
  $('saveBtn').addEventListener('click',function(){ save(); });

  // ---- PowerPoint export (admin only). Library is loaded on first click, so partners never download it. ----
  var PPT_LIB='https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js';
  function loadPptLib(){
    if(window.PptxGenJS) return Promise.resolve();
    return new Promise(function(res,rej){ var s=document.createElement('script'); s.src=PPT_LIB; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
  }
  // Consecutive hours with the same status and company become one block, e.g. 13:00 ~ 16:00.
  function meetingBlocks(t,d){
    var out=[], cur=null;
    hours.forEach(function(h){
      var k=key(t,d,h), st=state(k);
      if(st!=='booked' && st!=='hold'){ cur=null; return; }
      var info=details[k]||{}, id=st+'|'+(info.company||'');
      if(cur && cur.id===id && cur.e===h){ cur.e=h+1; return; }
      cur={id:id,s:h,e:h+1,state:st,info:info}; out.push(cur);
    });
    return out;
  }
  async function exportPpt(){
    if(snap()!==savedSnap){ msg('Save or discard your changes before exporting.',true); return; }
    msg('Building PowerPoint…');
    try{ await loadPptLib(); }catch(e){ msg('Could not load the PowerPoint library. Check your connection and try again.',true); return; }
    var KDOW=['일','월','화','수','목','금','토'];
    var FONT='Malgun Gothic', LINE='9A9A9A', HEAD='E9E9E9';
    var pptx=new PptxGenJS(); pptx.layout='LAYOUT_WIDE'; // 13.33 x 7.5 in
    var s=pptx.addSlide();
    var now=new Date();
    s.addText('LG R&D US Partner Meetings',{x:0.4,y:0.25,w:7.6,h:0.6,fontFace:FONT,fontSize:24,bold:true,color:'111111',margin:0});
    s.addText((now.getMonth()+1)+'/'+now.getDate()+'/'+String(now.getFullYear()).slice(2)+' 업데이트 기준',{x:8.1,y:0.33,w:3,h:0.45,fontFace:FONT,fontSize:11,bold:true,color:'111111',margin:0});
    s.addShape(pptx.ShapeType.line,{x:0,y:0.98,w:13.33,h:0,line:{color:'111111',width:1}});
    var border={type:'solid',pt:0.75,color:LINE};
    var head=[{text:'',options:{fill:{color:HEAD}}}].concat(C.days.map(function(d){
      var p=d.split('-').map(Number), dt=new Date(Date.UTC(p[0],p[1]-1,p[2]));
      return {text:p[1]+'/'+p[2]+'('+KDOW[dt.getUTCDay()]+')',options:{fill:{color:HEAD},bold:true,align:'center'}};
    }));
    var rows=[head];
    C.tracks.forEach(function(t){
      var row=[{text:t.name,options:{bold:true,align:'center'}}];
      C.days.forEach(function(d){
        var runs=[];
        meetingBlocks(t.id,d).forEach(function(b,i){
          if(i) runs.push({text:' ',options:{fontSize:6,breakLine:true}});
          runs.push({text:pad(b.s)+':00 ~ '+pad(b.e)+':00',options:{bold:true,fontSize:11,breakLine:true}});
          runs.push({text:(b.info.company||'Booked')+(b.state==='hold'?' (가예약)':''),options:{bold:true,fontSize:12,breakLine:true}});
          if(b.info.name) runs.push({text:b.info.name,options:{fontSize:9,color:'555555',breakLine:true}});
          if(b.info.address) runs.push({text:'@ '+b.info.address,options:{fontSize:9,color:'555555',breakLine:true}});
        });
        row.push(runs.length?{text:runs}:{text:''});
      });
      rows.push(row);
    });
    var labelW=0.9, dayW=(12.4-labelW)/C.days.length;
    s.addTable(rows,{x:0.45,y:1.3,w:12.4,colW:[labelW].concat(C.days.map(function(){return dayW})),
      rowH:[0.6].concat(C.tracks.map(function(){return 2.6})),
      fontFace:FONT,fontSize:11,color:'111111',valign:'middle',border:border,margin:[0.08,0.12,0.08,0.12]});
    var stamp=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
    try{ await pptx.writeFile({fileName:'LG_RnD_US_Partner_Meetings_'+stamp+'.pptx'}); msg('PowerPoint downloaded.'); }
    catch(e){ msg('Could not create the PowerPoint file. Try again.',true); }
  }
  $('pptBtn').addEventListener('click',exportPpt);

  // A small "Admin" button in the top-right corner opens a compact login popover.
  // Once unlocked, all controls live in the orange admin bar.
  function closePopover(){ $('adminBox').hidden=true; $('adminToggle').setAttribute('aria-expanded','false'); }
  function openAdmin(){
    var t=store('avail-admin-token'), p=store('avail-admin-pass');
    if(t&&p){ unlock(t,p); return; }   // this browser already has a saved login
    $('adminBox').hidden=false; $('adminToggle').setAttribute('aria-expanded','true'); $('tokenInput').focus();
  }
  function exitAdmin(){
    if(snap()!==savedSnap){ msg('Unsaved changes. Save or discard them first.',true); return; }
    // back to the partner view; the saved login stays, so the next "Admin" click unlocks straight away
    admin=false; token=null; pass=null; details={};
    $('adminToggle').hidden=false; msg('');
    if(location.hash==='#admin') history.replaceState(null,'',location.pathname+location.search);
    load();
  }
  $('exitBtn').addEventListener('click',exitAdmin);
  $('adminToggle').addEventListener('click',function(e){ e.stopPropagation(); if($('adminBox').hidden) openAdmin(); else closePopover(); });
  $('adminBox').addEventListener('click',function(e){ e.stopPropagation(); });
  document.addEventListener('click',function(){ if(!$('adminBox').hidden) closePopover(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape' && !$('adminBox').hidden){ closePopover(); $('adminToggle').focus(); } });
  function checkHash(){ if(location.hash==='#admin' && !admin) openAdmin(); }
  window.addEventListener('hashchange',checkHash);

  render();
  load();
  checkHash();
})();
</script>
</body>
</html>
